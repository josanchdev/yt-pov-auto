[project]
name = "animal-pov"
version = "0.1.0"
description = "Local-first pipeline for generating photorealistic animal-POV video content."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "structlog>=24.1",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
animal-pov = "src.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: full ffmpeg renders; minutes, not seconds"]
